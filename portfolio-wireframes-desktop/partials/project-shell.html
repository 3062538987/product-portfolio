<!-- ============================================================ -->
<!-- Shared Project Shell: Wireframe Page Wrapper (desktop)       -->
<!-- Node: gen-project-shell | Kind: project-shell                -->
<!-- Included by: all leaf pages in this project                  -->
<!-- ============================================================ -->

<div class="wf-shell-root w-full max-w-[1280px] mx-auto px-8 py-6" style="background-color: var(--wf-background);">
  <!-- Page Wrapper: dashed border -->
  <div class="wf-page-wrapper border-2 border-dashed p-6" style="border-color: var(--wf-wireframe-stroke); background-color: var(--wf-background);">

    <!-- Header Area -->
    <div class="wf-header border-2 border-dashed px-6 py-4 mb-6" style="border-color: var(--wf-wireframe-dashed); background-color: var(--wf-wireframe-fill);">
      <div class="flex items-center justify-between">
        <span class="wf-text-label">[导航栏 / Navigation]</span>
        <span class="wf-text-label">[菜单项占位]</span>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="wf-main border-2 border-dashed px-6 py-6 mb-6" style="border-color: var(--wf-wireframe-dashed); background-color: var(--wf-background);">
      <span class="wf-text-label block mb-4">[主内容区域 / Main Content]</span>

      <!-- SLOT: pageContent -->
      <!-- Leaf pages fill their private content here -->
      <!-- ============================================ -->
    </div>

    <!-- Footer Area -->
    <div class="wf-footer border-2 border-dashed px-6 py-4" style="border-color: var(--wf-wireframe-dashed); background-color: var(--wf-wireframe-fill);">
      <div class="flex items-center justify-between">
        <span class="wf-text-label">[页脚 / Footer]</span>
        <span class="wf-text-label">[链接占位]</span>
      </div>
    </div>

  </div>
</div>
